plugins {
    id "io.freefair.lombok" version "8.10.2"
    id 'java-library'
    id 'org.springframework.boot' version '4.0.3' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'maven-publish'
    id 'signing'
}

// 加载Nexus配置文件
def nexusConfig = new Properties()
file('nexus.properties').withInputStream { nexusConfig.load(it) }

// 全局配置
allprojects {
    group = 'org.itsuka'
    version = project.hasProperty('version') ? project.version : '1.0.0'
    
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/spring' }
        maven { url 'https://maven.aliyun.com/repository/spring-plugin' }
        mavenCentral()
    }
}

// 子项目通用配置
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    
    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    
    // 编码设置
    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
    
    // 依赖管理
    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.3"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.1"
        }
        
        dependencies {
            dependency 'org.mapstruct:mapstruct:1.6.3'
            dependency 'org.mapstruct:mapstruct-processor:1.6.3'
            dependency 'com.mysql:mysql-connector-j:8.0.33'
            dependency 'org.projectlombok:lombok:1.18.30'
            dependency 'jakarta.validation:jakarta.validation-api:3.1.1'
            dependency 'com.baomidou:mybatis-plus-spring-boot4-starter:3.5.16'
            dependency 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
            dependency 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.13'
            dependency 'io.minio:minio:8.6.0'
            dependency 'io.jsonwebtoken:jjwt-api:0.13.0'
            dependency 'io.jsonwebtoken:jjwt-impl:0.13.0'
            dependency 'io.jsonwebtoken:jjwt-jackson:0.13.0'
            dependency 'jakarta.activation:jakarta.activation-api:2.1.0'
        }
    }
    
    // 测试配置
    test {
        useJUnitPlatform()
    }
    
    // 为所有子项目添加源码和javadoc任务
    task sourcesJar(type: Jar) {
        from sourceSets.main.allJava
        archiveClassifier = 'sources'
    }
    
    task javadocJar(type: Jar) {
        from javadoc
        archiveClassifier = 'javadoc'
    }
    
    // 配置javadoc
    javadoc {
        if(JavaVersion.current().isJava9Compatible()) {
            options.addBooleanOption('html5', true)
        }
        
        // 忽略Javadoc警告和错误
        options.addStringOption('Xdoclint:none', '-quiet')
        options.addStringOption('encoding', 'UTF-8')
        options.addStringOption('charSet', 'UTF-8')
        failOnError = false
    }
}

// 为itsuka-开头的子项目添加发布配置
subprojects {
    if (project.name.startsWith('itsuka-')) {
        apply plugin: 'maven-publish'
        
        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java
                    
                    // 添加源码jar
                    artifact project.tasks.sourcesJar
                    
                    // 添加javadoc jar
                    artifact project.tasks.javadocJar
                    
                    // 解析依赖版本
                    versionMapping {
                        usage('java-api') {
                            fromResolutionOf('runtimeClasspath')
                        }
                        usage('java-runtime') {
                            fromResolutionResult()
                        }
                    }
                    
                    // POM文件配置
                    pom {
                        name = project.name
                        description = "Itsuka Spring Boot Starter - ${project.name}"
                        url = 'https://github.com/itsuka/itsuka-spring'
                        
                        licenses {
                            license {
                                name = 'The Apache License, Version 2.0'
                                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                            }
                        }
                        
                        developers {
                            developer {
                                id = 'itsuka'
                                name = 'Itsuka Team'
                                email = 'support@itsuka.com'
                            }
                        }
                        
                        scm {
                            connection = 'scm:git:git://github.com/itsuka/itsuka-spring.git'
                            developerConnection = 'scm:git:ssh://github.com:itsuka/itsuka-spring.git'
                            url = 'https://github.com/itsuka/itsuka-spring/tree/main'
                        }
                    }
                }
            }
            
            repositories {
                maven {
                    name = 'nexus'
                    url = version.endsWith('SNAPSHOT') ?
                        nexusConfig['nexus.repository.snapshots'] :
                        nexusConfig['nexus.repository.releases']
                    
                    credentials {
                        username = nexusConfig['nexus.username']
                        password = nexusConfig['nexus.password']
                    }
                    
                    // 允许不安全的协议（仅用于开发环境）
                    allowInsecureProtocol = true
                }
            }
        }
    }
}

// 根项目不构建 jar
jar {
    enabled = false
}