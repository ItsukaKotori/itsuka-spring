plugins {
    id "io.freefair.lombok" version "8.10.2"
    id 'java-library'
    id 'org.springframework.boot' version '3.5.5' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
}

// 全局配置
allprojects {
    group = 'org.itsuka'
    version = '1.0.0'
    
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/spring' }
        maven { url 'https://maven.aliyun.com/repository/spring-plugin' }
        mavenCentral()
    }
}

// 子项目通用配置
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    
    // 编码设置
    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
    
    // 依赖管理
    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.5"
        }
        
        dependencies {
            dependency 'org.mapstruct:mapstruct:1.5.3.Final'
            dependency 'org.mapstruct:mapstruct-processor:1.5.3.Final'
            dependency 'com.mysql:mysql-connector-j:8.0.33'
            dependency 'org.springdoc:springdoc-openapi-ui:2.8.13'
            dependency 'org.projectlombok:lombok:1.18.26'
            dependency 'jakarta.validation:jakarta.validation-api:3.0.2'
            dependency 'com.baomidou:mybatis-plus-boot-starter:3.5.7'
            dependency 'org.mybatis:mybatis-spring:3.0.3'
            dependency 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
            dependency 'io.minio:minio:8.5.2'
            dependency 'io.jsonwebtoken:jjwt-api:0.11.5'
            dependency 'io.jsonwebtoken:jjwt-impl:0.11.5'
            dependency 'io.jsonwebtoken:jjwt-jackson:0.11.5'
        }
    }
    
    // 测试配置
    test {
        useJUnitPlatform()
    }
}

// 根项目不构建 jar
jar {
    enabled = false
}