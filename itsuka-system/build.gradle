plugins {
    id 'org.springframework.boot'
    id 'java-library'
}

dependencies {
    // MapStruct - 使用根项目版本管理
    implementation 'org.mapstruct:mapstruct'
    annotationProcessor 'org.mapstruct:mapstruct-processor'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // SpringDoc OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    // Itsuka Security Starter
    implementation project(':common:itsuka-security-spring-boot-starter')
    
    // Flyway 数据库版本控制
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    
    // MyBatis Plus
    implementation 'com.baomidou:mybatis-plus-boot-starter'
    
    // MySQL
    implementation 'com.mysql:mysql-connector-j'
    
    // H2 数据库 - 用于开发和测试
    runtimeOnly 'com.h2database:h2'
    
    // 本项目依赖
    implementation project(':common:itsuka-spring-boot-starter')
    implementation project(':common:itsuka-mybatis-plus-spring-boot-starter')
    implementation project(':common:itsuka-redis-spring-boot-starter')
    
    // Spring Data Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    
    // 测试依赖
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}