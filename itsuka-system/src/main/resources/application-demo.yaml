spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:system;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  # 禁用Flyway，因为H2内存数据库每次启动都是全新的
  flyway:
    enabled: false
  # JPA配置，用于自动创建表结构
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true