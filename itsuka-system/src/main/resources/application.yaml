server:
  port: 8080
spring:
  application:
    name: system
  profiles:
    active: demo
  main:
    allow-bean-definition-overriding: true
  # Flyway 配置
  flyway:
    # 启用Flyway
    enabled: true
    # 编码格式
    encoding: UTF-8
    # 脚本位置
    locations: classpath:db/migration
    # 验证迁移脚本的checksum
    validate-on-migrate: true
    # 当迁移脚本中有未被执行的脚本时，是否执行这些脚本
    out-of-order: false
    # 当检测到已有数据库结构与迁移脚本不匹配时，是否忽略这个问题
    baseline-on-migrate: true
    # 基准版本号
    baseline-version: 1
    # 数据库模式
    schemas: system
  # MyBatis-Plus 配置
mybatis-plus:
  # 扫描mapper.xml文件
  mapper-locations: classpath:mapper/*.xml
  # 实体类包路径
  type-aliases-package: com.itsuka.system.domain
  configuration:
    # 驼峰命名转换
    map-underscore-to-camel-case: true
    # 日志级别
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    # 关闭MP3.0自带的banner
    banner: false
    db-config:
      # 主键类型：使用雪花算法生成ID
      id-type: ASSIGN_ID
      # 字段策略
      insert-strategy: NOT_NULL
      update-strategy: NOT_NULL
      where-strategy: NOT_NULL
      # 驼峰下划线转换
      table-underline: true
springdoc:
  api-docs:
    enabled: true
    # http://server:port/context-path/swagger-ui.html
    path: /swagger-ui.html