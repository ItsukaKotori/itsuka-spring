// 插件管理，配置阿里云插件仓库
pluginManagement {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/spring-plugin' }
        gradlePluginPortal()
        mavenCentral()
    }
}

// 依赖解析管理，配置阿里云依赖仓库
dependencyResolutionManagement {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/spring' }
        maven { url 'https://maven.aliyun.com/repository/spring-plugin' }
        mavenCentral()
    }
}

rootProject.name = 'itsuka-spring'

// 包含所有子模块
include 'common'
include 'common:itsuka-spring-boot-starter'
include 'common:itsuka-web-spring-boot-starter'
include 'common:itsuka-mybatis-plus-spring-boot-starter'
include 'common:itsuka-redis-spring-boot-starter'
include 'common:itsuka-dict-spring-boot-starter'
include 'common:itsuka-file-spring-boot-starter'
include 'common:itsuka-mqtt-spring-boot-starter'
include 'common:itsuka-security-spring-boot-starter'
include 'itsuka-system'
include 'itsuka-gateway'