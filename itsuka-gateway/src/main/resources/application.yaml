server:
  port: 8888

spring:
  application:
    name: itsuka-gateway
  
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: system-swagger-docs
          uri: http://localhost:8081
          predicates:
            - Path=/v3/api-docs/system
          filters:
            - SetPath=/v3/api-docs

        - id: music-swagger-docs
          uri: http://localhost:8082
          predicates:
            - Path=/v3/api-docs/music
          filters:
            - SetPath=/v3/api-docs
        - id: system-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=2

        - id: music-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/music/**
          filters:
            - StripPrefix=2
        
        # 网关聚合 Swagger UI 与文档代理
      
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
      
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
  
  main:
    web-application-type: reactive
  
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

itsuka:
  
  security:
    jwt:
      secret: itsuka-gateway-secret-key-for-jwt-token-generation-must-be-at-least-256-bits
      expiration: 24h
      issuer: itsuka-gateway
    auth:
      enabled: true
      # 跳过JWT认证的路径（登录、健康检查等公开接口）
      excluded-paths:
        - "/api/auth/**"
        - "/actuator/**"
        - "/swagger-ui/**"
        - "/v3/api-docs/**"
        - "/error"            # 错误页面

    # 访问控制配置（基于IP、User-Agent、路径的白名单/黑名单）
    access-control:
      enabled: true
      whitelist:
        enabled: false
        paths:
          - "/api/public/**"
          - "/actuator/health"
        ips:
          - "127.0.0.1"
          - "192.168.1.0/24"
        user-agents:
          - "*Chrome*"
          - "*Firefox*"
      blacklist:
        enabled: false
        paths:
          - "/api/admin/dangerous/**"
        ips:
          - "192.168.1.100"
          - "10.0.0.0/8"
        user-agents:
          - "*bot*"
          - "*crawler*"


management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    urls:
      - name: system
        url: /v3/api-docs/system
      - name: music
        url: /v3/api-docs/music
