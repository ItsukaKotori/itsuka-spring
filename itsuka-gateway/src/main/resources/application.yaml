server:
  port: 8888

spring:
  application:
    name: itsuka-gateway
  
  cloud:
    gateway:
      routes:
        - id: system-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=2
        
        - id: swagger-route
          uri: http://localhost:8080
          predicates:
            - Path=/swagger-ui/**,/v3/api-docs/**
      
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
      
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
  
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

itsuka:
  security:
    jwt:
      secret: itsuka-gateway-secret-key-for-jwt-token-generation-must-be-at-least-256-bits
      expiration: 24h
      issuer: itsuka-gateway
    auth:
      enabled: true

app:
  gateway:
    # JWT认证配置
    auth:
      # 跳过JWT认证的路径（登录、健康检查等公开接口）
      excluded-paths:
        - "/api/auth/**"      # 认证相关接口
        - "/actuator/**"      # 监控端点
        - "/swagger-ui/**"    # API文档
        - "/v3/api-docs/**"   # OpenAPI规范
        - "/error"            # 错误页面
        - "/fallback/**"      # 熔断降级页面
    
    # 访问控制配置（基于IP、User-Agent、路径的白名单/黑名单）
    access-control:
      enabled: true
      whitelist:
        enabled: false
        paths:
          - "/api/public/**"
          - "/actuator/health"
        ips:
          - "127.0.0.1"
          - "192.168.1.0/24"
        user-agents:
          - "*Chrome*"
          - "*Firefox*"
      blacklist:
        enabled: false
        paths:
          - "/api/admin/dangerous/**"
        ips:
          - "192.168.1.100"
          - "10.0.0.0/8"
        user-agents:
          - "*bot*"
          - "*crawler*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway