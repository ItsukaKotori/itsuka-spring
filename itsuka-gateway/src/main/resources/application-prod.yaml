# 生产环境配置
spring:
  data:
    redis:
      cluster:
        nodes:
          - redis-node1:6379
          - redis-node2:6379
          - redis-node3:6379
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 500
          max-idle: 20
          min-idle: 5

itsuka:
  security:
    jwt:
      secret: ${JWT_SECRET}

logging:
  level:
    root: WARN
    com.itsuka.gateway: INFO
  file:
    name: /var/log/itsuka-gateway/gateway.log