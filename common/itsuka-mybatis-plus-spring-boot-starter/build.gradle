dependencies {
    // MySQL 连接器
    api 'com.mysql:mysql-connector-j'
    
    // Spring Boot Starter
    api 'org.springframework.boot:spring-boot-starter'
    
    // Spring Security Core (for UserDetails)
    compileOnly 'org.springframework.security:spring-security-core'
    
    // MyBatis Plus (排除原有的 mybatis-spring)
    api('com.baomidou:mybatis-plus-boot-starter') {
        exclude group: 'org.mybatis', module: 'mybatis-spring'
    }
    
    // 使用指定版本的 MyBatis Spring
    api 'org.mybatis:mybatis-spring'
    
    // Jackson (for JSON annotations)
    api 'com.fasterxml.jackson.core:jackson-annotations'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // 本项目依赖 - 直接依赖itsuka-core
    api project(':common:itsuka-core')
    api project(':common:itsuka-web-spring-boot-starter')
}