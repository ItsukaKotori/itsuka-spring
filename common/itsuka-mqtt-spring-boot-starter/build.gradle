dependencies {
    // Netty 核心依赖
    implementation 'io.netty:netty-all:4.1.104.Final'
    
    // Spring Boot Starter
    implementation 'org.springframework.boot:spring-boot-starter'
    
    // Spring Boot Configuration Processor
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    
    // Lombok
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Jackson for JSON processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    
    // Validation
    implementation 'jakarta.validation:jakarta.validation-api'
    
    // 本项目依赖
    implementation project(':common:itsuka-core')
    
    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.netty:netty-transport-native-epoll:4.1.104.Final:linux-x86_64'
    testImplementation 'io.netty:netty-transport-native-kqueue:4.1.104.Final:osx-x86_64'
}