dependencies {
    // Netty 核心依赖 - 使用统一版本管理
    api 'io.netty:netty-all'

    // Spring Boot Starter
    api 'org.springframework.boot:spring-boot-starter'

    // Spring Boot Configuration Processor
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Jackson for JSON processing
    api 'com.fasterxml.jackson.core:jackson-databind'

    // Validation
    api 'jakarta.validation:jakarta.validation-api'

    // 本项目依赖
    api project(':common:itsuka-spring-boot-starter')

    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Netty 原生传输库 - 根据平台自动选择
    testImplementation 'io.netty:netty-transport-native-epoll'
    testImplementation 'io.netty:netty-transport-native-kqueue'
}
