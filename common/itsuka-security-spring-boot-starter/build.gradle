dependencies {
    // Spring Boot Starter - 使用 implementation 避免传递
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'

    // JWT dependencies
    api 'io.jsonwebtoken:jjwt-api'  // 暴露API给使用者
    implementation 'io.jsonwebtoken:jjwt-impl'
    implementation 'io.jsonwebtoken:jjwt-jackson'

    // Spring Security - 改为 implementation 确保运行时可用
    compileOnly 'org.springframework.security:spring-security-core'
    compileOnly 'org.springframework.security:spring-security-web'
    compileOnly 'org.springframework.security:spring-security-config'

    // 可选依赖 - 保持 compileOnly
    compileOnly 'org.springframework:spring-webflux'
    compileOnly 'org.springframework.cloud:spring-cloud-starter-gateway'

    // Jackson - 使用 implementation 避免版本冲突
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Configuration processor
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Validation - 使用 implementation
    api 'org.springframework.boot:spring-boot-starter-validation'

    // Common module dependencies
    api project(':common:itsuka-spring-boot-starter')

    // Redis - 使用 implementation
    implementation project(':common:itsuka-redis-spring-boot-starter')

    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}